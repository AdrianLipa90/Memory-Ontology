name: Pip TCD affective hair and orbital orchestration
on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/pip-project/**'
      - '.github/workflows/pip-tcd-affective-hair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imported-tcd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [mobile, semantic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/The-Consciousness-Dictionary
          ref: 5fe9daa5e2b4841e598628aa5a1a7beadb0e70b1
          path: _tcd
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/PhaseNav-Natural-Coding-System
          ref: 3a11576d0477be8a4f172d9a606318c6ad9ab9f3
          path: _pncs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/PNCore-BioOS
          ref: ff8d5f191c77c7ce1b371ff0dddc74300fc061cc
          path: _bioos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/PNV-State-Memory
          ref: 8a677caf0a5e810ddffd35811c038915f38fb142
          path: _pnv_state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./_tcd -e ./_pncs pytest numpy
      - run: python -m pip install -r projects/pip-project/integrations/pnaml/${{ matrix.variant }}/skills/pnaml-coupled-phase-stream/references/requirements.txt
      - env:
          TCD_ROOT: _tcd
          PNCS_ROOT: _pncs
          PNV_STATE_MEMORY_ROOT: _pnv_state
          PYTHONPATH: _pnv_state/src
          BIOOS_ROOT: _bioos
          PNAML_VARIANT: ${{ matrix.variant }}
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q projects/pip-project/tests
