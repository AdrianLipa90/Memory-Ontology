name: Pip PNAML integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/pip-project/integrations/pnaml/**'
      - '.github/workflows/pip-pnaml-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/pip-project/integrations/pnaml/mobile/skills/pnaml-coupled-phase-stream/references/requirements.txt
      - name: Mobile original Coupler regression and native causal Hotel
        working-directory: projects/pip-project/integrations/pnaml/mobile/skills/pnaml-coupled-phase-stream/references
        run: python -m unittest test_pip test_pip_memory test_coupled test_pip_causal_native -v
      - name: Semantic Adapter original Coupler regression and native causal Hotel
        working-directory: projects/pip-project/integrations/pnaml/semantic/skills/pnaml-coupled-phase-stream/references
        run: python -m unittest test_pip test_pip_memory test_coupled test_pip_causal_native -v
      - run: python projects/pip-project/integrations/pnaml/build_overlays.py
      - uses: actions/upload-artifact@v4
        with:
          name: PNAML-Pip-causal-overlays
          path: projects/pip-project/integrations/pnaml/dist/*.zip
