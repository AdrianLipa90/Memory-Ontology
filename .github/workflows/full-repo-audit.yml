name: Full repository audit
on:
  push:
    branches: [audit/full-repo-e2e-20261126]
permissions:
  contents: read
jobs:
  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f62ba7e08fda0229db10e17ee57a67d93614bc0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and inventory
        run: |
          git rev-parse HEAD
          git ls-files
      - name: Install test dependencies
        run: python -m pip install pytest numpy scipy jsonschema coverage
      - name: Compile existing source
        run: python -m compileall -q algebra engines tests
      - name: Run all existing tests
        run: |
          python -m coverage run --source=algebra,engines -m pytest -ra -v --junitxml=repo-tests.xml tests
          python -m coverage report -m
          python -m coverage json -o repo-coverage.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-tests
          path: |
            repo-tests.xml
            repo-coverage.json
      - name: Execute existing FOLD Collatz witness
        run: python engines/fold_collatz_witness.py
      - name: Archive exact audited source
        if: always()
        run: git archive --format=zip -o audited-source.zip HEAD
      - name: Upload exact source for local replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-source
          path: audited-source.zip
  pncs-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f62ba7e08fda0229db10e17ee57a67d93614bc0
          path: ontology
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdrianLipa90/PhaseNav-Natural-Coding-System
          ref: 958d41402c3af4107856fccee849027aedfaad8d
          path: pncs-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every existing PNCS declaration using original compiler
        env:
          PYTHONPATH: pncs-source/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from phasenav_natural_code.hybrid_memory_grammar_v03 import compile_hybrid_memory_program
          rows=[]
          for p in sorted(Path("ontology").rglob("*.pncs")):
              try:
                  c=compile_hybrid_memory_program(p.read_text())
                  rows.append({"path":str(p),"status":"COMPILED","ir_sha256":c.ir_sha256,"execution": "NOT_RUN"})
              except Exception as e:
                  rows.append({"path":str(p),"status":"FAIL","error":str(e)})
          print(json.dumps(rows,indent=2))
          Path("pncs-compile.json").write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pncs-compile
          path: pncs-compile.json
